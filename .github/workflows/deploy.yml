name: Deploy to Google Cloud VM

on:
  push:
    branches:
      - main          # Deploy otomatis saat push ke main
  workflow_dispatch:  # Bisa trigger manual dari GitHub UI

jobs:
  # ─── JOB 1: TEST ───────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  # ─── JOB 2: DEPLOY ─────────────────────────────────────
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: test   # Deploy hanya jika test lulus

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.GCP_VM_IP }}" ]; then
            echo "❌ GCP_VM_IP secret is empty or not found"
            exit 1
          fi

          if [ -z "${{ secrets.GCP_VM_USER }}" ]; then
            echo "❌ GCP_VM_USER secret is empty or not found"
            exit 1
          fi

          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "🔑 Adding VM host key..."
          ssh-keyscan -T 10 -H "${{ secrets.GCP_VM_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} \
              'bash -s' << 'ENDSSH'

            set -euo pipefail  # Exit jika ada error

            echo "🚀 Starting deployment..."
            cd ${{ secrets.APP_DIR }}
            PREV_COMMIT="$(git rev-parse HEAD)"
            echo "🧷 Previous commit: $PREV_COMMIT"

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📦 Installing dependencies..."

            # Gunakan ecosystem file yang tersedia
            if [ -f ecosystem.config.cjs ]; then
              PM2_CONFIG="ecosystem.config.cjs"
            elif [ -f ecosystem.config.js ]; then
              PM2_CONFIG="ecosystem.config.js"
            else
              echo "❌ PM2 ecosystem config not found"
              exit 1
            fi

            rollback() {
              echo "↩️ Rolling back to previous commit: $PREV_COMMIT"
              git reset --hard "$PREV_COMMIT"
              npm ci
              npm run build
              pm2 reload "$PM2_CONFIG" --env production || pm2 start "$PM2_CONFIG" --env production
            }

            if ! {
              echo "🏗️ Building app..."
              npm ci
              npm run build

              echo "🔄 Restarting application..."
              pm2 reload "$PM2_CONFIG" --env production || pm2 start "$PM2_CONFIG" --env production

              echo "🩺 Local health check..."
              curl -fsS http://127.0.0.1:3000/health >/dev/null
            }; then
              echo "❌ Deploy validation failed."
              rollback
              exit 1
            fi

            echo "✅ Deployment complete!"
            pm2 status
          ENDSSH

      - name: Health Check
        run: |
          echo "⏳ Waiting for app to start..."
          sleep 10

          # Health check ke endpoint kamu
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.GCP_VM_IP }}/health || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed! Status: $HTTP_STATUS"
          else
            echo "❌ Health check failed. Status: $HTTP_STATUS"
            exit 1
          fi
